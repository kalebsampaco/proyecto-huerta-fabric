services:
  sensor-simulator:
    build: .
    container_name: huerta-sensor-simulator
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Set KAFKA_BOOTSTRAP_SERVERS in .env}
      KAFKA_TOPIC: ${KAFKA_TOPIC:?Set KAFKA_TOPIC in .env}
      KAFKA_CONNECTION_STRING: ${KAFKA_CONNECTION_STRING:?Set KAFKA_CONNECTION_STRING in .env}
      SIM_INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-5}
      SENSOR_COUNT: ${SENSOR_COUNT:-4}
      ANOMALY_EVERY_N_EVENTS: ${ANOMALY_EVERY_N_EVENTS:-20}
      BACKFILL_DAYS: ${BACKFILL_DAYS:-180}
      BACKFILL_RECORDS_PER_DAY: ${BACKFILL_RECORDS_PER_DAY:-1000}
      BACKFILL_STATE_FILE: /data/backfill-complete.json
    volumes:
      - simulator-state:/data

volumes:
  simulator-state: